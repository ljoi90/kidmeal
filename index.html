/* Layout: one phone-width column; sticky header with age + tabs; fridge tab (ingredient chips) → recipe tab (matched list) → full-screen recipe sheet */
:root{
  --bg:#FFFAEB; --surface:#FFFFFF; --ink:#2B2310; --muted:#7A6E52; --line:#F1E6C6;
  --accent:#FFC21A; --accent-ink:#2B2310; --accent-soft:#FFF2C4; --accent-text:#9A6A00;
  --yolk:#FFC21A; --yolk-soft:#FFF2C4; --yolk-ink:#4A3A06; --warn:#C2410C; --warn-soft:#FDE8DC;
  --badge-bg:#2B2310; --badge-fg:#FFC21A;
  --display:"Spoqa Han Sans Neo",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --body:"Spoqa Han Sans Neo",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17140C; --surface:#221E13; --ink:#F4EEDC; --muted:#ADA285; --line:#383120;
  --accent:#FFC933; --accent-ink:#1F1A0C; --accent-soft:#3A3115; --accent-text:#FFD45C;
  --yolk:#FFC933; --yolk-soft:#3A3115; --yolk-ink:#FFE08A; --warn:#F2946A; --warn-soft:#3D2519;
  --badge-bg:#FFC933; --badge-fg:#1F1A0C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17140C; --surface:#221E13; --ink:#F4EEDC; --muted:#ADA285; --line:#383120;
  --accent:#FFC933; --accent-ink:#1F1A0C; --accent-soft:#3A3115; --accent-text:#FFD45C;
  --yolk:#FFC933; --yolk-soft:#3A3115; --yolk-ink:#FFE08A; --warn:#F2946A; --warn-soft:#3D2519;
  --badge-bg:#FFC933; --badge-fg:#1F1A0C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:14px 8px}
h1{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.1;margin:0;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--accent-text)}
.sub{color:var(--muted);font-size:13px}
.ages{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.ages button{border:0;background:none;border-radius:9px;padding:8px 4px;font-size:13px;font-weight:500;color:var(--muted)}
.ages button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;gap:20px;padding-block:10px 0}
.tabs button{border:0;background:none;padding:8px 0 10px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;display:flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--yolk)}
.count{font-variant-numeric:tabular-nums;background:var(--yolk-soft);color:var(--yolk-ink);border-radius:99px;padding:0 8px;font-size:12px;line-height:20px}

main{padding-block:16px 120px}
.panel{display:flex;flex-direction:column;gap:22px}
.search{position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit}
.search input::placeholder{color:var(--muted)}
.picked{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.picked-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.label{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.link{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:4px}
.empty-note{color:var(--muted);font-size:14px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:14px;display:inline-flex;align-items:center;gap:6px;transition:background .15s}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:500}
.chip[aria-pressed="true"]::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent-text)}
.chip.x{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.x::after{content:"×";font-size:16px;line-height:1;opacity:.8}
.cat h3{font-size:14px;font-weight:700;margin:0 0 10px;display:flex;gap:8px;align-items:center}
.cat h3 i{width:10px;height:10px;border-radius:3px;display:inline-block}
details.allergy{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
details.allergy summary{font-weight:700;font-size:14px;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.allergy summary::-webkit-details-marker{display:none}
details.allergy summary span{color:var(--muted);font-weight:400}
details.allergy .chips{margin-top:12px}
.chip.al[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn)}
.chip.al[aria-pressed="true"]::before{background:var(--warn)}

.fab{position:fixed;left:0;right:0;bottom:0;z-index:15;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-top:14px;background:linear-gradient(to top,var(--bg) 60%,transparent)}
.fab button{width:100%;border:0;border-radius:14px;padding:15px;background:var(--ink);color:var(--bg);font-weight:700;font-size:16px;display:flex;justify-content:center;gap:8px}
.fab b{color:var(--yolk)}

.group{display:flex;flex-direction:column;gap:10px}
.group h2{font-family:var(--display);font-weight:700;font-size:21px;margin:0;display:flex;align-items:baseline;gap:8px}
.group h2 small{font-family:var(--body);font-size:13px;color:var(--muted)}
.card{display:grid;grid-template-columns:92px minmax(0,1fr) auto;grid-template-rows:auto auto auto;gap:3px 12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px 10px 10px}
.card:hover{border-color:var(--accent)}
.thumb{grid-row:1/span 3;width:92px;height:92px;object-fit:cover;border-radius:11px;background:var(--line);display:block}
.card .name{font-weight:700;font-size:16px;min-width:0;align-self:end}
.card .meta{grid-column:2}
.card .bar{grid-column:2/-1;align-self:start}
.mins{grid-row:1/span 2;grid-column:3;align-self:center;text-align:center;min-width:52px;border-radius:12px;background:var(--badge-bg);color:var(--badge-fg);padding:6px 4px;line-height:1.1}
.mins b{display:block;font-family:var(--display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.mins span{font-size:11px}
.meta{font-size:13px;color:var(--muted);min-width:0}
.meta .need{color:var(--warn);font-weight:500}
.bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
[hidden]{display:none!important}
.hero{display:block;width:100%;max-width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:18px;margin-top:16px;background:var(--line)}
.bar i{display:block;height:100%;background:var(--accent)}
.more-btn{border:1px dashed var(--line);background:none;border-radius:var(--r);padding:12px;color:var(--muted);font-weight:500}
.blank{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted)}
.blank strong{display:block;color:var(--ink);font-family:var(--display);font-weight:700;font-size:20px;margin-bottom:6px}
.safety{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;margin:6px 0 0}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.sheet-bar{position:sticky;top:0;background:var(--bg);z-index:2;border-bottom:1px solid var(--line)}
.sheet-bar .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.back{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:14px;font-weight:500}
.sheet h2{font-family:var(--display);font-weight:700;letter-spacing:-.02em;font-size:30px;line-height:1.15;margin:18px 0 8px;text-wrap:balance}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.fact{font-size:12.5px;border-radius:99px;padding:3px 10px;background:var(--surface);border:1px solid var(--line)}
.fact.y{background:var(--badge-bg);border-color:transparent;color:var(--badge-fg);font-weight:700}
.fact.w{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.sec{margin-top:24px}
.sec h3{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin:0 0 10px}
.ing{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.ing li{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-top:1px solid var(--line);font-size:15px}
.ing li:first-child{border-top:0}
.ing .st{font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;margin-right:8px}
.ing .ok{background:var(--accent-soft);color:var(--accent-text)}
.ing .no{background:var(--warn-soft);color:var(--warn)}
.ing .op{background:var(--line);color:var(--muted)}
.ing .amt{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.seasons{font-size:13.5px;color:var(--muted);margin:10px 2px 0}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:4px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer}
ol.steps li::before{content:counter(s);grid-row:span 2;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
ol.steps li.done{opacity:.55}
ol.steps li.done::before{content:"✓";background:var(--accent);color:var(--accent-ink)}
ol.steps li.done p{text-decoration:line-through}
ol.steps p{margin:0;min-width:0}
.timer{justify-self:start;margin-top:6px;border:1px solid var(--yolk);background:var(--yolk-soft);color:var(--yolk-ink);border-radius:99px;padding:3px 12px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.timer.run{background:var(--yolk);color:#3A2C00}
.timer.end{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tip{background:var(--yolk-soft);color:var(--yolk-ink);border-radius:var(--r);padding:14px 16px;font-size:14.5px}
.tip b{display:block;margin-bottom:2px}
.serv{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px;margin-bottom:10px}
.serv-l{font-size:14px;font-weight:500;color:var(--ink);min-width:0}
.sel{position:relative;flex:none}
.sel::after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;border-right:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.sel select{appearance:none;-webkit-appearance:none;font:inherit;font-size:15px;font-weight:700;color:var(--accent-ink);background:var(--accent);border:0;border-radius:9px;padding:8px 36px 8px 14px;cursor:pointer;min-width:112px}
.sel select:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
.ing .amt.chg{color:var(--accent-text);font-weight:700}
.scale-note{font-size:13px;color:var(--muted);margin:8px 2px 0;line-height:1.5}
.mini{position:fixed;left:0;right:0;bottom:0;z-index:45;padding-top:10px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.mini-btn{pointer-events:auto;display:flex;align-items:center;gap:12px;border-radius:14px;padding:10px 10px 10px 16px;background:var(--badge-bg);color:var(--badge-fg);box-shadow:0 8px 24px rgba(0,0,0,.22);cursor:pointer}
.mini-dot{width:9px;height:9px;border-radius:50%;background:var(--badge-fg);animation:blink 1s infinite}
.mini-t{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.mini-l{flex:1;min-width:0;font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-x{border:1px solid currentColor;background:none;color:inherit;border-radius:9px;padding:6px 10px;font-size:13px;font-weight:500;opacity:.85}
.alarm{position:fixed;inset:0;z-index:60;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;overflow-y:auto;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.alarm-in{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.ring{width:120px;height:120px;border-radius:50%;border:5px solid currentColor;display:grid;place-items:center;margin-bottom:8px;animation:shake 1.2s infinite}
.al-menu{margin:0;font-size:14px;font-weight:500;opacity:.8}
.alarm h2{margin:0;font-size:30px;font-weight:700;letter-spacing:-.02em}
.al-step{margin:0 0 12px;font-size:16px;line-height:1.5;min-width:0}
.al-stop{width:100%;border:0;border-radius:16px;padding:18px;font-size:19px;font-weight:700;background:var(--accent-ink);color:var(--accent)}
.al-more{width:100%;border:2px solid currentColor;background:none;border-radius:16px;padding:14px;font-size:16px;font-weight:700;color:inherit}
@keyframes blink{50%{opacity:.25}}
@keyframes shake{0%,60%,100%{transform:rotate(0)}10%,30%,50%{transform:rotate(-12deg)}20%,40%{transform:rotate(12deg)}}
@media (prefers-reduced-motion:reduce){.ring,.mini-dot{animation:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="top">
      <h1>10분 <em>아기밥</em></h1>
      <span class="sub">12–36개월 유아식</span>
    </div>
    <div class="ages" role="group" aria-label="아이 월령">
      <button data-age="12">12–17개월</button>
      <button data-age="18">18–23개월</button>
      <button data-age="24">24–36개월</button>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-fridge" aria-selected="true">우리집 재료 <span class="count" id="c-pick">0</span></button>
      <button role="tab" id="tab-recipes" aria-selected="false">추천 레시피 <span class="count" id="c-rec">0</span></button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="panel" id="p-fridge">
    <div class="search"><input id="q" type="search" placeholder="재료 검색 (예: 애호박, 두부)" autocomplete="off"></div>
    <div class="picked">
      <div class="picked-head"><span class="label">지금 있는 재료</span><button class="link" id="clear">모두 지우기</button></div>
      <div class="chips" id="picked"></div>
    </div>
    <div id="cats" class="panel"></div>
    <details class="allergy" id="allergy">
      <summary>알레르기 재료 빼기 <span id="al-sum">없음</span></summary>
      <div class="chips" id="al-chips"></div>
    </details>
  </section>

  <section class="panel" id="p-recipes" hidden></section>
</main>

<div class="fab" id="fab"><div class="wrap"><button id="go">레시피 <b id="go-n">0</b>개 보기</button></div></div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="s-title">
  <div class="sheet-bar"><div class="wrap"><button class="back" id="close">← 목록</button></div></div>
  <div class="wrap" id="s-body"></div>
</div>

<div class="mini" id="mini" hidden><div class="wrap">
  <div class="mini-btn" id="mini-btn" role="button" tabindex="0" aria-label="진행 중인 타이머 열기">
    <span class="mini-dot" aria-hidden="true"></span>
    <span class="mini-t" id="mini-t">0:00</span>
    <span class="mini-l" id="mini-l"></span>
    <button class="mini-x" id="mini-x" aria-label="타이머 취소">취소</button>
  </div>
</div></div>

<div class="alarm" id="alarm" hidden role="alertdialog" aria-modal="true" aria-labelledby="al-title" aria-describedby="al-step">
  <div class="alarm-in">
    <div class="ring" aria-hidden="true"><svg viewBox="0 0 24 24" width="54" height="54" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></div>
    <p class="al-menu" id="al-menu"></p>
    <h2 id="al-title">타이머가 끝났어요</h2>
    <p class="al-step" id="al-step"></p>
    <button class="al-stop" id="al-stop">알람 끄기</button>
    <button class="al-more" id="al-more">1분 더 익히기</button>
  </div>
</div>

  get(k,d){try{const v=localStorage.getItem("kidmeal:"+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem("kidmeal:"+k,JSON.stringify(v))}catch(e){}}

let noAlg = new Set(store.get("noAlg", []));

const $ = s => document.querySelector(s);

function allergensOf(r){
  const s=new Set();
  [...r.need.map(x=>x[0]), ...r.s.map(x=>x.split(" ")[0])].forEach(i=>(ALG[i]||[]).forEach(a=>s.add(a)));
  return [...s];
}
R.forEach(r=>r.alg=allergensOf(r));

function matches(){
  const list=[];
  if(!pantry.size) return list;
  for(const r of R){
    if(r.a>age) continue;
    if(r.alg.some(a=>noAlg.has(a))) continue;
    const need=r.need.map(x=>x[0]);
    const have=need.filter(i=>pantry.has(i));
    if(!have.length) continue;
    list.push({r,have,miss:need.filter(i=>!pantry.has(i)),ratio:have.length/need.length});
  }
  return list.sort((a,b)=>a.miss.length-b.miss.length||b.ratio-a.ratio||a.r.m-b.r.m);
}

function chip(name,on,cls=""){
  return `<button class="chip ${cls}" aria-pressed="${on}" data-ing="${name}">${name}</button>`;
}
function renderFridge(){
  const q=$("#q").value.trim();
  $("#picked").innerHTML = pantry.size
    ? [...pantry].map(n=>`<button class="chip x" data-ing="${n}" aria-label="${n} 빼기">${n}</button>`).join("")
    : `<p class="empty-note">아래에서 냉장고에 있는 재료를 눌러 담아 주세요.</p>`;
  $("#cats").innerHTML = CATS.map(c=>{
    const items=c.items.filter(i=>!q||i.includes(q));
    if(!items.length) return "";
    return `<div class="cat"><h3><i style="background:${c.color}"></i>${c.name}</h3><div class="chips">${items.map(i=>chip(i,pantry.has(i))).join("")}</div></div>`;
  }).join("") || `<p class="empty-note">‘${q.replace(/</g,"&lt;")}’ 재료는 아직 없어요. 다른 이름으로 찾아보세요.</p>`;
  $("#al-chips").innerHTML = ALG_LIST.map(a=>`<button class="chip al" aria-pressed="${noAlg.has(a)}" data-al="${a}">${a}</button>`).join("");
  $("#al-sum").textContent = noAlg.size?[...noAlg].join(", ")+" 제외":"없음";
}

function card(m){
  const need = m.miss.length ? `<span class="need">${m.miss.join(", ")} 필요</span>` : "재료 다 있어요";
  return `<button class="card" data-r="${m.r.id}">
    <img class="thumb" src="img/${m.r.id}.webp" alt="" width="92" height="92" loading="lazy">
    <span class="name">${m.r.n}</span>
    <span class="mins"><b>${m.r.m}</b><span>분</span></span>
    <span class="meta">${m.have.length}/${m.r.need.length} 재료 · ${need}</span>
    <span class="bar"><i style="width:${Math.round(m.ratio*100)}%"></i></span>
  </button>`;
}
function renderRecipes(){
  const list=matches();
  const ready=list.filter(m=>!m.miss.length), one=list.filter(m=>m.miss.length===1), rest=list.filter(m=>m.miss.length>1);
  let h="";
  if(!pantry.size){
    h=`<div class="blank"><strong>재료를 먼저 골라 주세요</strong>냉장고에 있는 재료를 담으면 10분 안에 만들 수 있는 메뉴를 찾아 드려요.</div>`;
  } else if(!list.length){
    h=`<div class="blank"><strong>맞는 레시피가 없어요</strong>재료를 더 담거나 알레르기 제외를 줄여 보세요.</div>`;
  } else {
    if(ready.length) h+=`<div class="group"><h2>지금 바로 만들 수 있어요 <small>${ready.length}개</small></h2>${ready.map(card).join("")}</div>`;
    if(one.length) h+=`<div class="group"><h2>재료 하나만 더 있으면 <small>${one.length}개</small></h2>${one.map(card).join("")}</div>`;
    if(rest.length) h+= showMore
      ? `<div class="group"><h2>장보고 만들어요 <small>${rest.length}개</small></h2>${rest.map(card).join("")}</div>`
      : `<button class="more-btn" id="more">재료가 더 필요한 레시피 ${rest.length}개 보기</button>`;
  }
  h+=`<p class="safety">레시피는 1인분 기준이고, 레시피 화면에서 10인분까지 바꿀 수 있어요. 처음 먹는 재료는 오전에 소량으로 시작하고, 24개월 전에는 간을 최소로 해 주세요. 둥글고 단단한 음식은 잘게 잘라 질식을 예방하세요. 음식 사진은 AI로 만든 예시 이미지라 실제 완성 모습과 다를 수 있어요.</p>`;
  $("#p-recipes").innerHTML=h;
  $("#c-rec").textContent=list.length;
  $("#go-n").textContent=list.length;
  $("#c-pick").textContent=pantry.size;
}

let curRid=null;
let serv=Math.min(10,Math.max(1,+store.get("serv",1)||1));
const gcd=(a,b)=>b?gcd(b,a%b):a;
function fmtNum(x){
  const w=Math.floor(x+1e-9), f=x-w;
  if(f<1e-6) return String(w);
  for(const d of [2,3,4,6,8]){const n=Math.round(f*d); if(n>0&&n<d&&Math.abs(n/d-f)<0.02){const g=gcd(n,d); const fr=(n/g)+"/"+(d/g); return w?w+" "+fr:fr;}}
  return String(Math.round(x*10)/10);
}
function scaleAmt(s,k){
  if(k===1) return s;
  const t=s.replace(/(^|\s)한 /,"$11");
  const m=t.match(/(\d+\/\d+|\d+(?:\.\d+)?)(?:~(\d+(?:\.\d+)?))?/);
  if(!m) return s;
  const v=x=>x.includes("/")?(+x.split("/")[0])/(+x.split("/")[1]):+x;
  let rep=fmtNum(v(m[1])*k); if(m[2]) rep+="~"+fmtNum(v(m[2])*k);
  return t.replace(m[0],rep);
}
function fmt(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}

function renderIng(r){
  const row=(i,cls,lab)=>{const a=scaleAmt(i[1],serv); return `<li><span><span class="st ${cls}">${lab}</span>${i[0]}</span><span class="amt${a!==i[1]?" chg":""}">${a}</span></li>`;};
  const seas=r.s.map(x=>{const sp=x.indexOf(" "); return sp<0?x:x.slice(0,sp)+" "+scaleAmt(x.slice(sp+1),serv);});
  $("#s-ing").innerHTML=`<ul class="ing">
      ${r.need.map(i=>pantry.has(i[0])?row(i,"ok","있음"):row(i,"no","필요")).join("")}
      ${r.opt.map(i=>row(i,"op","선택")).join("")}
    </ul>${seas.length?`<p class="seasons">기본양념 · ${seas.join(", ")}</p>`:""}
    ${serv>1?`<p class="scale-note">양이 늘면 익는 시간도 길어져요. 타이머가 끝나면 속까지 익었는지 확인하고, 덜 익었으면 30초~1분씩 더 익혀 주세요.</p>`:""}`;
  const sel=$("#serv-sel"); if(sel) sel.value=String(serv);
  const f=$("#serv-fact"); if(f) f.textContent=serv+"인분";
}

      ${r.st.map((s,i)=>`<li data-i="${i}"><p>${s[0]}</p>${s[1]?`<button class="timer" data-i="${i}" data-sec="${s[1]}">${fmt(s[1])} 타이머</button>`:""}</li>`).join("")}

function closeRecipe(){ $("#sheet").hidden=true; document.body.style.overflow=""; curRid=null; syncTimerUI(); }

/* ---- timer engine: keeps running when the recipe is closed ---- */
let T=null;          // {rid, i, sec, end, iv}
let ac=null, wake=null, alarmIv=null, alarmStop=null, titleIv=null;
const baseTitle=document.title;
function unlockAudio(){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==="suspended") ac.resume(); }catch(e){ ac=null; } }
function beep(t0,f){ const o=ac.createOscillator(), g=ac.createGain(); o.type="sine"; o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.4,t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.28);
  o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0+0.3); }
function ringOnce(){
  if(ac){ try{ const t=ac.currentTime+0.02; beep(t,880); beep(t+0.35,880); beep(t+0.7,1175); }catch(e){} }
  try{ navigator.vibrate && navigator.vibrate([400,150,400]); }catch(e){}
}
async function keepAwake(){ try{ if(navigator.wakeLock && !wake) wake=await navigator.wakeLock.request("screen"); }catch(e){ wake=null; } }
function releaseAwake(){ try{ wake && wake.release(); }catch(e){} wake=null; }
function askNotify(){ try{ if("Notification" in window && Notification.permission==="default"){ const p=Notification.requestPermission(); p&&p.catch&&p.catch(()=>{}); } }catch(e){} }
function sendNotify(title,body){ try{ if("Notification" in window && Notification.permission==="granted") new Notification(title,{body,tag:"kidmeal-timer",requireInteraction:true}); }catch(e){} }

function startTimer(rid,i,sec){
  cancelTimer(false);
  unlockAudio(); keepAwake(); askNotify();
  T={rid,i,sec,end:Date.now()+sec*1000};
  T.iv=setInterval(tick,250); tick();
}
function cancelTimer(resync=true){ if(T){ clearInterval(T.iv); T=null; } releaseAwake(); if(resync) syncTimerUI(); }
function left(){ return T?Math.max(0,Math.ceil((T.end-Date.now())/1000)):0; }
function tick(){ if(!T) return; if(left()<=0){ finishTimer(); return; } syncTimerUI(); }
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) tick(); });

function syncTimerUI(){
  document.querySelectorAll("#s-body .timer").forEach(b=>{
    const on=T && T.rid===curRid && +b.dataset.i===T.i;
    b.className="timer"+(on?" run":"");
    b.textContent=on? fmt(left())+" 남음 · 멈춤" : fmt(+b.dataset.sec)+" 타이머";
  });
  const show=!!T && (T.rid!==curRid);
  $("#mini").hidden=!show;
  if(show){
    const r=R.find(x=>x.id===T.rid);
    $("#mini-t").textContent=fmt(left());
    $("#mini-l").textContent=`${r.n} · ${T.i+1}단계`;
    $("#mini").style.bottom=(!$("#fab").hidden && $("#sheet").hidden)?"70px":"0px";
  }
}
function finishTimer(){
  const done=T; clearInterval(T.iv); T=null; releaseAwake();
  const r=R.find(x=>x.id===done.rid);
  if(curRid===done.rid){ const li=document.querySelector(`#s-body ol.steps li[data-i="${done.i}"]`); li&&li.classList.add("done"); }
  syncTimerUI();
  showAlarm(r,done);
}
function showAlarm(r,done){
  $("#al-menu").textContent=`${r.n} · ${done.i+1}단계`;
  $("#al-step").textContent=r.st[done.i][0];
  $("#alarm").hidden=false; $("#alarm").dataset.rid=done.rid; $("#alarm").dataset.i=done.i;
  $("#al-stop").focus();
  ringOnce(); alarmIv=setInterval(ringOnce,1600);
  alarmStop=setTimeout(()=>{ clearInterval(alarmIv); alarmIv=null; },120000);
  let on=false; titleIv=setInterval(()=>{ document.title=(on=!on)?"⏰ 다 됐어요!":baseTitle; },800);
  sendNotify("타이머가 끝났어요",`${r.n} ${done.i+1}단계: ${r.st[done.i][0]}`);
}
function stopAlarm(){
  clearInterval(alarmIv); clearTimeout(alarmStop); clearInterval(titleIv); alarmIv=alarmStop=titleIv=null;
  document.title=baseTitle; try{ navigator.vibrate && navigator.vibrate(0); }catch(e){}
  $("#alarm").hidden=true;
}
$("#al-stop").addEventListener("click",stopAlarm);
$("#al-more").addEventListener("click",()=>{ const a=$("#alarm"); stopAlarm(); startTimer(a.dataset.rid,+a.dataset.i,60); });
$("#mini-btn").addEventListener("click",()=>{ if(T){ const id=T.rid; openRecipe(id); setTimeout(()=>{ const li=document.querySelector(`#s-body ol.steps li[data-i="${T?T.i:0}"]`); li&&li.scrollIntoView({block:"center"}); },50);} });
$("#mini-btn").addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); $("#mini-btn").click(); } });
$("#mini-x").addEventListener("click",e=>{ e.stopPropagation(); cancelTimer(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !$("#alarm").hidden) stopAlarm(); });

$("#s-body").addEventListener("change",e=>{
  if(e.target.id==="serv-sel"){ serv=Math.min(10,Math.max(1,+e.target.value||1)); store.set("serv",serv); renderIng(R.find(x=>x.id===curRid)); }
});
$("#s-body").addEventListener("click",e=>{
  const t=e.target.closest(".timer");
  if(t){
    e.stopPropagation();
    const i=+t.dataset.i;
    if(T && T.rid===curRid && T.i===i){ cancelTimer(); return; }
    startTimer(curRid,i,+t.dataset.sec); return;
  }
  const li=e.target.closest("ol.steps li"); if(li) li.classList.toggle("done");
});

document.addEventListener("click",e=>{
  const ing=e.target.closest("[data-ing]");
  if(ing){ const n=ing.dataset.ing; pantry.has(n)?pantry.delete(n):pantry.add(n); showMore=false; renderAll(); return; }
  const al=e.target.closest("[data-al]");
  if(al){ const a=al.dataset.al; noAlg.has(a)?noAlg.delete(a):noAlg.add(a); renderAll(); return; }
  const ag=e.target.closest("[data-age]");
  if(ag){ age=+ag.dataset.age; renderAll(); return; }
  const c=e.target.closest("[data-r]"); if(c){ openRecipe(c.dataset.r); return; }
  if(e.target.id==="more"){ showMore=true; renderRecipes(); }
});
$("#q").addEventListener("input",renderFridge);
$("#clear").addEventListener("click",()=>{pantry.clear(); renderAll();});
$("#tab-fridge").addEventListener("click",()=>setTab("fridge"));
$("#tab-recipes").addEventListener("click",()=>setTab("recipes"));
$("#go").addEventListener("click",()=>setTab("recipes"));
$("#close").addEventListener("click",closeRecipe);
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !$("#sheet").hidden) closeRecipe(); });

renderAll();
</script>

</body>
</html>
